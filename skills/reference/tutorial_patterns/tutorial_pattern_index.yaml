routing_rules:
  - If the module maps to multiple families, Workflow Plan must use CaseSpec physics and active fields to choose the minimal family cards.
  - If only mesh dictionaries are needed, read `mesh_boundary_contracts` and avoid loading flow-family cards.
  - If thermodynamic fields and phase fractions both appear, read both `free_surface_vof` and `shock_and_compressible_flow`.
  - If species, progress variables, or combustion dictionaries appear, read `multicomponent_reacting_flow`.
  - Do not infer numeric values, geometry sizes, material constants, boundary values, or solver controls from this pattern index.
