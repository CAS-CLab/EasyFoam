source:
  repository: OpenFOAM/OpenFOAM-13
  tree: tutorials
  url: https://github.com/OpenFOAM/OpenFOAM-13/tree/master/tutorials
  extraction: recursive tree path aggregation
  concrete_case_names_included: false
  openfoam_version: "13"
  source_commit: null
  generated_at: null
  generator_version: null
  provenance_status: unverified

directory_grammar:
  root: tutorials
  module_level: "<solver-or-physics-module>"
  case_level: "<tutorial-case>"
  required_case_subtrees:
    - "0/ or <time-directory>/"
    - constant/
    - system/
  common_run_helpers:
    - Allrun
    - Allclean
    - Allmesh
    - parallel/decomposition helpers

module_patterns:
  incompressibleFluid:
    families:
      - incompressible_flow
    pattern_tags:
      - pressure_velocity_coupling
      - single_phase_transport
      - turbulence_optional
      - block_mesh_common
      - dynamic_mesh_possible
    expected_file_categories:
      initial_fields:
        - velocity
        - pressure_like
        - turbulence_optional
      constant:
        - physicalProperties
        - momentumTransport
      system:
        - controlDict
        - fvSchemes
        - fvSolution
        - blockMeshDict_or_mesh_import

  fluid:
