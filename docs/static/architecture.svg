<title id="title">EasyFoam library architecture</title><desc id="desc">A coding agent loads the root skill, follows Plan, Write, Run and Postprocess, and retains structured evidence. Explicit human decisions govern experience-based library changes. References, schemas and deterministic tools support both loops.</desc>
